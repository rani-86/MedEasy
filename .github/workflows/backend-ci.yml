name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Type-check
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/backend
        run: npm run build
