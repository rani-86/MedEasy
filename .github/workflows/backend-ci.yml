name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medeasy
          POSTGRES_PASSWORD: medeasy_password
          POSTGRES_DB: medeasy_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medeasy:medeasy_password@localhost:5432/medeasy_auth?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-characters
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 30
      OTP_LENGTH: 6
      OTP_EXPIRY_SECONDS: 300
      OTP_MAX_ATTEMPTS: 5
      ALLOWED_ORIGINS: http://localhost:3000
      SMS_PROVIDER_API_KEY: ci-test-key
      DEMO_MODE: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Type-check
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/backend
        run: npm run build

      - name: Run migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: apps/backend
        run: npm test
